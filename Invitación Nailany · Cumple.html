<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nailany cumple 2 · Monsters, Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#a9e1ef;--teal-d:#6cc3dc;--purple:#cdb9f2;--purple-d:#a98fdf;--green:#cfeb8f;--pink:#ff8fbd;--pink-l:#ffd6e8;--yellow:#fff0a6;--orange:#ffd0a8;--ink:#8d73d6;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;--body:'Barlow Condensed','Arial Narrow',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);color:var(--ink);background:#bfeaf8;overflow-x:hidden}
body.lock{overflow:hidden}
#app{max-width:460px;margin:0 auto;position:relative;overflow:hidden;opacity:0;transition:opacity 1s;
  background:radial-gradient(#fff9 2.5px,transparent 3px) 0 0/30px 30px,linear-gradient(180deg,#bfeaf8 0,#d9c9f7 26%,#ffd3e8 50%,#d7f4a8 76%,#a9e3f5 100%)}
#app.show{opacity:1}
section{position:relative;padding:26px 22px;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:62px;padding-bottom:0}
.hero+section{padding-top:0}

.bunting{position:absolute;top:0;left:0;width:100%;height:80px;z-index:4}
.bunting polygon{transform-origin:50% 0;transform-box:fill-box;animation:sway 3s ease-in-out infinite}
.bunting polygon:nth-child(even){animation-delay:-1.2s}
@keyframes sway{50%{transform:rotate(9deg)}}
.sp{position:absolute;width:14px;height:14px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 2.6s infinite ease-in-out;opacity:0;z-index:1}
@keyframes tw{50%{opacity:1;transform:scale(1.8) rotate(45deg)}}

.kicker{font-family:var(--body);font-weight:700;font-size:26px;letter-spacing:1px;color:var(--teal-d);animation:pop .8s .2s both}
.name{font-family:var(--display);font-weight:400;font-size:clamp(70px,24vw,112px);line-height:1;margin:0;display:flex;justify-content:center;letter-spacing:2px}
.name span{--c:#cdb9f2;--s:#a98fdf;display:inline-block;color:var(--c);-webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 7px 0 var(--s);animation:drop .9s cubic-bezier(.3,1.6,.5,1) both,wave 2.6s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-300px) scale(.3) rotate(-40deg);opacity:0}}
@keyframes wave{50%{transform:translateY(-8px) rotate(3deg)}}
.cumple{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px;animation:pop .9s 1.4s both}
.cumple span{font-family:var(--display);font-size:60px;letter-spacing:3px;color:var(--pink);-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #f27fae}
.two{display:grid;place-items:center;width:78px;height:96px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 32% 28%,#fff,#e6dcfa 30%,#cdb9f2);box-shadow:inset -6px -8px 14px #a98fdf55;font-family:var(--display);font-size:72px;line-height:1;color:#a9e1ef;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #6cc3dc;animation:bob 3s ease-in-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-12deg);opacity:0}}

/* Boo */
.scene{position:relative;width:min(66vw,270px);margin-top:2px;z-index:3}
.scene::before{content:"";position:absolute;left:50%;top:40%;width:150%;aspect-ratio:1;translate:-50% -50%;z-index:-1;border-radius:50%;
  background:repeating-conic-gradient(#ffffff88 0 10deg,#ffffff00 10deg 20deg);animation:spin 30s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 68%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%)}
@keyframes spin{to{rotate:360deg}}
.boo-main{width:100%;height:auto;display:block;animation:bob 3.4s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 12px 10px #cdb9f255)}
.boo-main.jump{animation:jump .7s}
@keyframes bob{50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes jump{30%{transform:translateY(-50px) scale(1.06,.96) rotate(-4deg)}60%{transform:translateY(0) scale(.96,1.04)}}
.bu{position:absolute;left:-6px;top:8%;z-index:5;font-family:var(--display);font-size:44px;color:#fff;background:var(--pink);padding:2px 18px 6px;border-radius:30px 30px 30px 6px;box-shadow:0 6px 0 #f27fae;transform:scale(0) rotate(-8deg);transform-origin:bottom right;animation:auto 6s 3s infinite;pointer-events:none}
@keyframes auto{0%,72%,100%{transform:scale(0) rotate(-8deg)}78%{transform:scale(1.15) rotate(-6deg)}84%,94%{transform:scale(1) rotate(-6deg)}}
@keyframes say{0%{transform:scale(0) rotate(-8deg)}25%{transform:scale(1.3) rotate(-6deg)}70%{transform:scale(1) rotate(-6deg)}100%{transform:scale(0)}}
.bp{transform:translate(var(--px,0px),var(--py,0px));transition:transform .15s}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pig{animation:pg 2.4s ease-in-out infinite}
.pig.l{transform-origin:70px 80px}.pig.r{transform-origin:130px 80px;animation-delay:-1.2s}
@keyframes pg{50%{transform:rotate(9deg)}}
.pig.r{animation-name:pg2}@keyframes pg2{50%{transform:rotate(-9deg)}}
.bal{transform-origin:197px 142px;animation:bl 3s ease-in-out infinite}
@keyframes bl{50%{transform:rotate(7deg)}}

/* monstruos */
.mon{position:absolute;z-index:2;filter:drop-shadow(0 8px 8px #a98fdf44)}
.m1{bottom:74px;left:-14px;width:118px;animation:fl 4s ease-in-out infinite}
.m3{bottom:46px;right:-2px;width:88px;animation:fl 5s -1s ease-in-out infinite reverse}
.m2{bottom:-26px;left:-14px;width:190px;animation:peek 4s ease-in-out infinite}
@keyframes fl{50%{transform:translate(8px,-14px) rotate(4deg)}}
@keyframes peek{50%{transform:translateY(-20px)}}

/* tarjetas */
.reveal{opacity:0;transform:translateY(50px) scale(.92);transition:all .9s cubic-bezier(.2,1.2,.4,1)}
.reveal.in{opacity:1;transform:none}
.card{background:#ffffffd9;border-radius:32px;padding:22px 18px;margin:0 auto;max-width:340px;border:5px solid var(--c,var(--pink-l));box-shadow:0 12px 0 var(--c2,#ffc3dc66),0 20px 30px #cdb9f244}
.date{border-top:3px solid var(--pink);border-bottom:3px solid var(--pink);padding:4px 0}
.date .d{font-family:var(--display);letter-spacing:8px;color:var(--purple);font-size:26px}
.date .num{font-family:var(--display);font-size:112px;line-height:1.05;color:var(--pink);-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 6px 0 var(--teal);animation:beat 2s infinite}
.date .m{font-family:var(--display);letter-spacing:5px;color:var(--purple);font-size:28px}
@keyframes beat{50%{transform:scale(1.1)}}
.place{margin-top:16px;font-weight:700;font-size:34px;color:var(--pink);line-height:1}
.addr{font-size:24px;color:var(--teal-d);font-weight:600;line-height:1.1;margin-top:6px}
.time{margin-top:10px;font-weight:700;color:var(--pink);font-size:28px}
.h2{font-family:var(--display);font-size:32px;letter-spacing:2px;margin:0 0 12px;color:var(--purple-d);font-weight:400}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{border-radius:18px;padding:8px 0;color:#fff;position:relative;overflow:hidden;box-shadow:0 5px 0 #0001}
.cd div:nth-child(1){background:#a9e1ef}.cd div:nth-child(2){background:#cdb9f2}.cd div:nth-child(3){background:#ffb3d1}.cd div:nth-child(4){background:#c2e56f}
.cd b{display:block;font-family:var(--display);font-size:38px;font-weight:400;line-height:1.1}
.cd small{font-size:15px;font-weight:700;letter-spacing:1px}
.btn{display:inline-flex;gap:10px;align-items:center;padding:16px 34px;border-radius:60px;background:linear-gradient(135deg,#ff8fbd,#ffc59a);color:#fff;font-family:var(--display);letter-spacing:1px;font-size:26px;text-decoration:none;box-shadow:0 8px 0 #f27fae,0 18px 26px #ff8fbd55;animation:pulse 1.8s infinite}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #f27fae}
.btn svg{width:30px;height:30px;animation:pin 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pin{50%{transform:translateY(-6px)}}
.final{padding-bottom:230px}
.te{font-family:var(--display);font-weight:400;letter-spacing:2px;font-size:54px;color:var(--pink);margin:0;line-height:1.1;display:inline-block;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #f27fae;animation:wig 2.4s infinite ease-in-out}
@keyframes wig{25%{transform:rotate(-4deg) scale(1.05)}75%{transform:rotate(4deg) scale(1.05)}}
.boo-t{margin-top:8px;font-size:24px;font-weight:600;line-height:1.15}
.boo-s{position:absolute;right:10px;bottom:4px;width:118px;height:auto;z-index:3;animation:peek 3.6s ease-in-out infinite}

.ball{position:fixed;bottom:-140px;width:54px;height:68px;border-radius:50% 50% 46% 46%;z-index:6;animation:rise linear forwards;cursor:pointer}
.ball::before{content:"";position:absolute;left:28%;top:14%;width:14px;height:20px;border-radius:50%;background:#fffa;transform:rotate(25deg)}
.ball::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:#b9b3d8}
@keyframes rise{to{transform:translate(var(--sx),-130vh)}}
.cf{position:fixed;width:10px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:cf 1.3s ease-out forwards}
@keyframes cf{40%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}100%{transform:translate(calc(var(--dx)*1.2),calc(var(--dy) + 420px)) rotate(calc(var(--r)*2));opacity:0}}

/* puerta */
#door{position:fixed;inset:0;z-index:50;background:radial-gradient(#fff8 3px,transparent 4px) 0 0/34px 34px,linear-gradient(180deg,#bfeaf8,#e0d0fa 50%,#ffcfe5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;transition:opacity .9s,transform .9s;cursor:pointer;overflow:hidden}
#door.gone{opacity:0;transform:scale(1.6);pointer-events:none}
#door h1{font-family:var(--display);font-weight:400;font-size:38px;margin:0;color:var(--purple);-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 5px 0 var(--purple-d);animation:beat 2s infinite}
.hint{font-family:var(--body);font-weight:700;letter-spacing:1px;font-size:28px;color:var(--pink);text-shadow:0 2px 0 #fff;animation:fade 1.6s infinite}
@keyframes fade{50%{opacity:.4}}
.frame{position:relative;width:min(58vw,240px);aspect-ratio:3/5;border:10px solid var(--purple);border-radius:22px 22px 6px 6px;background:radial-gradient(circle,#fff 0,#fff3a8 55%,#ffd84d);perspective:900px;box-shadow:0 0 60px #fff,0 0 0 6px #fff}
.buw{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:78px;color:var(--pink);-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #f27fae;transform:scale(0)}
#door.open .buw{animation:buw 1.2s .35s both}
@keyframes buw{0%{transform:scale(0) rotate(-15deg)}50%{transform:scale(1.4) rotate(6deg)}100%{transform:scale(1.1) rotate(-4deg)}}
.door{position:absolute;inset:0;border-radius:10px 10px 0 0;transform-origin:left center;background:linear-gradient(160deg,#ffe6f1,#ffc3dc);overflow:hidden;animation:knock 2.2s infinite;transition:transform 1.2s cubic-bezier(.6,-.1,.3,1)}
.door::before{content:"";position:absolute;inset:18% 12% 10%;border:4px solid #fff8;border-radius:12px}
.door .plate{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:30px;box-shadow:0 4px 0 var(--teal-d)}
.door .knob{position:absolute;right:12%;top:52%;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,var(--yellow) 60%,#f0b400)}
@keyframes knock{0%,70%,100%{transform:rotateY(0)}74%{transform:rotateY(-6deg)}78%{transform:rotateY(0)}82%{transform:rotateY(-5deg)}86%{transform:rotateY(0)}}
#door.open .door{animation:none;transform:rotateY(-110deg)}
#door.open .hint,#door.open h1{opacity:0;animation:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.ball{display:none}}
.fl{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.garland{position:absolute;left:-20px;width:calc(100% + 40px);height:auto;z-index:3;pointer-events:none}
.garland.t{top:-34px}.garland.b{bottom:-34px}
.fw{animation:fw 2.6s ease-in-out infinite}
@keyframes fw{50%{transform:scale(1.15) rotate(14deg)}}

#door{background:radial-gradient(#fff7 3px,transparent 4px) 0 0/34px 34px,linear-gradient(180deg,#f9cdd9,#f1b3c5)}
#door h1{color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 #e58aa8,0 0 18px #fff8}
#door .hint{color:#fff;text-shadow:0 3px 0 #e58aa8}
.dw{position:relative;width:min(64vw,260px);aspect-ratio:612/1008;perspective:1100px;filter:drop-shadow(0 14px 16px #c4668a44)}
.dw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.leaf{transform-origin:18.6% 50%;animation:knock 2.2s infinite;transition:transform 1.2s cubic-bezier(.6,-.1,.3,1)}
#door.open .leaf{animation:none;transform:rotateY(-112deg)}
.bu2{position:absolute;left:18.6%;top:19%;width:62.7%;height:71.6%;display:grid;place-items:center;font-family:var(--display);font-size:68px;color:var(--pink);-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #f27fae;transform:scale(0)}
#door.open .bu2{animation:buw 1.2s .35s both}
.lf{animation:fw 2.6s ease-in-out infinite}
</style>
</head>
<body class="lock">

<div id="door" role="button" aria-label="Abrir la puerta de la invitación">
  <h1>¡Shhh! Hay una sorpresa</h1>
  <div class="dw">
    <svg class="back" viewBox="0 0 612 1008" aria-hidden="true">
      <defs><radialGradient id="glow" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#fffdea"/><stop offset=".6" stop-color="#fff2b0"/><stop offset="1" stop-color="#ffe08a"/></radialGradient></defs>
      <polygon points="72,965 100,915 510,915 548,965" fill="#d9ac68"/>
      <path d="M92 958 L308 926 L526 958 M170 944 L308 934 L450 944" stroke="#4a4a4e" stroke-width="15" fill="none" stroke-linejoin="miter"/>
      <rect x="68" y="145" width="46" height="770" fill="#a3a5a8"/><rect x="498" y="145" width="45" height="770" fill="#a3a5a8"/>
      <polygon points="68,145 98,143 248,118 258,94 352,94 362,118 510,143 543,145 543,190 68,190" fill="#a3a5a8"/>
      <rect x="114" y="186" width="384" height="8" fill="#6d6d72"/>
      <circle cx="305" cy="125" r="23" fill="#c0c2c5"/><circle cx="305" cy="125" r="16" fill="#ff8aa0"/><ellipse cx="303" cy="119" rx="9" ry="7" fill="#ffc0cc"/>
      <circle cx="228" cy="130" r="6" fill="#c0c2c5"/><circle cx="383" cy="130" r="6" fill="#c0c2c5"/>
      <rect x="114" y="194" width="384" height="721" fill="url(#glow)"/>
      <g id="brk"></g>
    </svg>
    <div class="bu2">¡BU!</div>
    <svg class="leaf" viewBox="0 0 612 1008" aria-hidden="true">
      <rect x="114" y="194" width="384" height="721" fill="#f1e6e3"/>
      <g fill="none" stroke="#e7a9d0" stroke-width="2.5">
        <path d="M200 562V286A38.5 38.5 0 0 1 277 286V562Z"/><path d="M208 554V288A30.5 30.5 0 0 1 269 288V554Z"/>
        <path d="M344 562V286A38.5 38.5 0 0 1 421 286V562Z"/><path d="M352 554V288A30.5 30.5 0 0 1 413 288V554Z"/>
        <rect x="200" y="614" width="77" height="218"/><rect x="208" y="622" width="61" height="202"/>
        <rect x="344" y="614" width="77" height="218"/><rect x="352" y="622" width="61" height="202"/>
      </g>
      <g id="lflw"></g>
      <circle cx="459" cy="570" r="19" fill="#bfae62"/><circle cx="462" cy="566" r="14" fill="#e0cb7c"/>
      <ellipse cx="461" cy="620" rx="8" ry="16" fill="#fff"/><circle cx="461" cy="617" r="3" fill="#6d6d72"/><path d="M458.5 619h5l1.5 8h-8z" fill="#6d6d72"/>
    </svg>
  </div>
  <div class="hint">Toca la puerta para abrir</div>
</div>

<main id="app">
  <svg class="bunting" viewBox="0 0 460 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6 Q230 40 460 6" stroke="#c9c2e6" stroke-width="2" fill="none"/><g id="flags"></g></svg>

  <section class="hero" id="hero">
    <img class="mon m1" data-i="mike" alt="">
    <img class="mon m3" data-i="randall" alt="">

    <div class="kicker">¡Estás invitado!</div>
    <h1 class="name" id="name" aria-label="Nailany"></h1>
    <div class="cumple"><span>CUMPLE</span><b class="two">2</b></div>
    <div class="scene" id="scene">
      <div class="bu" id="bu">¡Bu!</div>
      <img class="boo-main" id="boo" data-i="boo" alt="Boo con su disfraz de monstruo">
    </div>
  </section>

  <section>
    <div class="card reveal">
      <div class="date"><div class="d">LUNES</div><div class="num">23</div><div class="m">DE NOVIEMBRE</div></div>
      <div class="place">Salón “La Piñata”</div>
      <div class="addr">Cristóbal Colón 417<br>Rincón de las Plazas</div>
      <div class="time">A partir de las 5 P.M.</div>
    </div>
  </section>

  <section>
    <div class="card reveal" style="--c:#d9c9f7;--c2:#cdb9f266">
      <h2 class="h2">¡Ya casi es la fiesta!</h2>
      <div class="cd" id="cd"><div><b id="dd">0</b><small>DÍAS</small></div><div><b id="hh">0</b><small>HORAS</small></div><div><b id="mm">0</b><small>MIN</small></div><div><b id="ss">0</b><small>SEG</small></div></div>
    </div>
  </section>

  <section>
    <div class="reveal">
      <a class="btn" target="_blank" rel="noopener" href="https://maps.app.goo.gl/xdPxaqAW4pD1tLj47">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        VER UBICACIÓN
      </a>
    </div>
  </section>

  <section class="final">
    <div class="reveal">
      <p class="te">¡Te esperamos!</p>
      
    </div>
    <img class="mon m2" data-i="sulley" alt="">
    <img class="boo-s" data-i="boo" alt="">
  </section>

function fl(x,y,r,n,pc,cc,i){let g=`<g class="lf" style="transform-origin:${x}px ${y}px;animation-delay:${i*.35}s">`;
  for(let k=0;k<n;k++)g+=`<ellipse cx="${x}" cy="${y-r*.5}" rx="${r*.27}" ry="${r*.5}" fill="${pc}" transform="rotate(${k*360/n} ${x} ${y})"/>`;
  return g+`<circle cx="${x}" cy="${y}" r="${r*.28}" fill="${cc}"/></g>`}
document.getElementById('lflw').innerHTML=fl(303,580,46,6,'#b3b5e2','#e88dbb',0)+fl(239,621,28,5,'#eaa8d1','#bdb7e4',1)+fl(239,715,25,5,'#eaa8d1','#efe38c',2)+fl(383,666,26,5,'#eaa8d1','#efe38c',3)+fl(294,813,46,5,'#eaa8d1','#efe38c',4);
(function(){let h='';for(let i=0;i<5;i++){const y=435+i*99;h+=`<polygon points="57,${y} 90,${y+6} 90,${y+93} 57,${y+95}" fill="#b4b6b9"/><polygon points="554,${y} 522,${y+6} 522,${y+93} 554,${y+95}" fill="#b4b6b9"/>`}document.getElementById('brk').innerHTML=h})();
const cols=['#a9e1ef','#cdb9f2','#cfeb8f','#ff8fbd','#ffd6e8','#fff0a6','#ffd0a8'];
const $=s=>document.querySelector(s);

(function(){let h='';const n=14;for(let i=0;i<n;i++){const x=i*(460/n)+6,t=x/460,y=6+34*(t<.5?t:1-t);
  h+=`<polygon points="${x},${y} ${x+26},${y+4} ${x+12},${y+34}" fill="${cols[i%7]}"/>`}$('#flags').innerHTML=h})();

'NAILANY'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;
  s.style.animationDelay=`${.4+i*.12}s,${1.5+i*.15}s`;$('#name').appendChild(s)});

for(let i=0;i<34;i++){const s=document.createElement('i');s.className='sp';
  s.style.cssText=`left:${Math.random()*94}%;top:${Math.random()*100}%;background:${cols[i%7]};animation-delay:${Math.random()*3}s`;$('#app').appendChild(s)}

function burst(x,y,n=30){for(let i=0;i<n;i++){const c=document.createElement('i');c.className='cf';
  c.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%7]};--dx:${(Math.random()-.5)*320}px;--dy:${-80-Math.random()*220}px;--r:${Math.random()*720}deg`;
  document.body.appendChild(c);setTimeout(()=>c.remove(),1400)}}
document.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('lock'))burst(e.clientX,e.clientY,18)});

function ball(){const b=document.createElement('div');b.className='ball';const c=cols[Math.floor(Math.random()*7)];
  b.style.background=`radial-gradient(circle at 30% 28%,#fffa,${c} 62%)`;b.style.left=Math.random()*88+'%';
  b.style.setProperty('--sx',(Math.random()-.5)*120+'px');b.style.animationDuration=(9+Math.random()*7)+'s';
  b.addEventListener('pointerdown',e=>{e.stopPropagation();const r=b.getBoundingClientRect();burst(r.left+27,r.top+30,22);b.remove()});
  b.addEventListener('animationend',()=>b.remove());document.body.appendChild(b)}

const boo=$('#boo');

boo.addEventListener('pointerdown',()=>{boo.classList.remove('jump');void boo.offsetWidth;boo.classList.add('jump');
  const b=$('#bu');b.style.animation='none';void b.offsetWidth;b.style.animation='say 1.2s';setTimeout(()=>{b.style.animation='';boo.classList.remove('jump')},1300)});

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.25});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

const target=new Date(2026,10,23,17,0,0);
function tick(){const d=target-new Date();
  if(d<=0){$('#cd').innerHTML='<p class="te" style="font-size:40px;grid-column:1/-1">¡Hoy es la fiesta! 🎉</p>';return}
  const s=Math.floor(d/1e3);$('#dd').textContent=Math.floor(s/86400);$('#hh').textContent=Math.floor(s%86400/3600);
  $('#mm').textContent=Math.floor(s%3600/60);$('#ss').textContent=s%60}
tick();setInterval(tick,1000);

$('#door').addEventListener('click',()=>{const d=$('#door');if(d.classList.contains('open'))return;d.classList.add('open');
  setTimeout(()=>burst(innerWidth/2,innerHeight/2,70),600);
  setTimeout(()=>{d.classList.add('gone');$('#app').classList.add('show');document.body.classList.remove('lock');
    for(let i=0;i<8;i++)setTimeout(ball,i*500);setInterval(ball,1800)},1900)});
</script>
</body>
</html>
